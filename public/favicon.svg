<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- The logo mark from the header, in the colors of the app's light and dark themes. -->
  <style>
    .mark { fill: #3446d4; }
    .label { fill: #ffffff; }
    @media (prefers-color-scheme: dark) {
      .mark { fill: #8c9bff; }
      .label { fill: #0b0e1a; }
    }
  </style>
  <rect class="mark" width="32" height="32" rx="6" />
  <text
    class="label"
    x="16"
    y="16.5"
    text-anchor="middle"
    dominant-baseline="central"
    font-family="system-ui, 'Segoe UI', Roboto, sans-serif"
    font-size="12"
    font-weight="700"
    letter-spacing="0.3"
  >PDF</text>
</svg>
